<!doctype html>
<!--
  Página de respaldo del service worker (ver `public/sw.js`).

  Se sirve sólo cuando alguien navega sin conexión a una pantalla que este teléfono nunca guardó
  —ni en esta visita ni en ninguna anterior—. Por eso es la única pieza de la aplicación que no
  puede depender de nada dinámico: ni de `/_next/static/*` (podría no estar guardado tampoco), ni
  de una consulta a la API (no hay red). Es HTML y CSS sueltos, a propósito.

  No promete que «lo que ves es lo último que se descargó»: acá no hay nada descargado que
  mostrar, y decir eso sería el mismo error ya corregido una vez en `lib/api.ts` (ver el
  comentario de `leerError`), sólo que en otro fichero.
-->
<html lang="es-CO">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d4c58" />
    <title>Sin conexión — Koinonía</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.25rem;
        box-sizing: border-box;
        background: #faf8f4;
        color: #171310;
        font:
          1.0625rem/1.65 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      main {
        max-width: 34rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0 0 1rem;
      }
      .simbolo {
        font-size: 2rem;
        line-height: 1;
        margin-bottom: 1rem;
      }
      button {
        font: inherit;
        font-weight: 600;
        padding: 0.6rem 1.1rem;
        border-radius: 0.5rem;
        border: 1px solid #0d4c58;
        background: #0d4c58;
        color: #ffffff;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #0d4c58;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="simbolo" aria-hidden="true">⚠</p>
      <h1>Sin conexión</h1>
      <p>
        No hay señal, y esta pantalla todavía no se había guardado en este teléfono para verse sin
        conexión. Las que ya visitaste antes sí quedan disponibles — ésta, al ser la primera vez,
        no.
      </p>
      <p>
        Volvé a intentarlo cuando tengas datos o wifi. No perdiste nada de lo que ya estaba escrito.
      </p>
      <button type="button" onclick="location.reload()">Volver a intentar</button>
    </main>
  </body>
</html>
