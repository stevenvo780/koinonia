name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Pureza del dominio (ADR-0001)
        run: node scripts/check-domain-purity.mjs

      - run: pnpm run typecheck
      - run: pnpm run lint

      # Las pruebas de integración del ledger corren contra PostgreSQL REAL con Testcontainers.
      # `KOINONIA_REQUIRE_DOCKER=1` hace que la ausencia de Docker sea un FALLO y no un salto
      # silencioso: un build verde que no probó nada del ledger es peor que un build rojo.
      - name: Comprobar que Docker está disponible
        run: docker info

      # `test:coverage` (no `test`) corre la MISMA suite una sola vez, instrumentada, y hace fallar
      # el build si algún paquete cae por debajo de su piso de `vitest.config.ts`
      # (`test.coverage.thresholds`, uno por paquete — docs/TESTING.md §3). No es un paso aparte: es
      # el mismo `pnpm run test` con `--coverage`, así que no hay una segunda corrida completa de
      # 2 495 pruebas sumando minutos por nada.
      - run: pnpm run test:coverage
        env:
          KOINONIA_REQUIRE_DOCKER: '1'

      - run: pnpm run build
      - run: pnpm run build:web

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # Extremo a extremo — pipeline ESCALONADO en tres tramos.
  #
  # 1. En un pull request corre SÓLO Chromium (`e2e-pr`, abajo): el ciclo de revisión tiene que
  #    caber en el tiempo que alguien está dispuesto a esperar mirando la pestaña, y la mayoría de
  #    las regresiones aparecen en el primer navegador.
  # 2. Al integrar en `main` corre la matriz entera —Chromium, Firefox, WebKit, Chrome móvil y
  #    Safari móvil— (`e2e-main`, abajo, que llama a `e2e-matriz-completa.yml`), porque esto se usa
  #    en un teléfono y Safari móvil es donde fallan las cosas que en el escritorio funcionan.
  # 3. De noche corre la MISMA matriz completa otra vez (`nocturno.yml`), sin depender de que
  #    alguien empuje a `main`: es la red de seguridad que agarra la deriva del entorno —una imagen
  #    de `ubuntu-latest` nueva, una versión de navegador que `playwright install` empezó a traer
  #    distinta— aunque no haya habido ningún push ese día.
  #
  # ⚠ CI es el ÚNICO sitio donde la matriz corre entera, y no por comodidad. WebKit no arranca en
  # las máquinas de desarrollo del equipo (Arch/CachyOS: `playwright install --with-deps` usa
  # `apt-get`, y las librerías que WebKit pide son versiones que Arch ya no distribuye — HANDOFF §2.4).
  # Por eso NADA de esta matriz lleva `continue-on-error`, ni aquí ni en `e2e-matriz-completa.yml`: si
  # el único sitio donde WebKit se prueba además perdona sus fallos, WebKit deja de estar probado y
  # nadie se entera. Un rojo aquí es información; un verde comprado no vale nada.
  # ═══════════════════════════════════════════════════════════════════════════════════════════

  e2e-pr:
    name: e2e · Chromium (pull request)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Navegadores (sólo Chromium)
        run: pnpm exec playwright install --with-deps chromium

      - name: Comprobar que Docker está disponible
        run: docker info

      - run: pnpm run e2e
        env:
          CI: 'true'

      # Se sube TAMBIÉN `test-results/`: ahí es donde Playwright deja las trazas
      # (`trace: retain-on-failure`) y las capturas. El informe HTML dice *qué* falló; la traza es lo
      # único que permite averiguar *por qué* sin poder reproducirlo en la máquina de nadie —que es
      # exactamente la situación de WebKit, que en este repositorio no arranca fuera de CI—.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-pr
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-main:
    name: e2e · matriz completa (main)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/e2e-matriz-completa.yml
