name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Pureza del dominio (ADR-0001)
        run: node scripts/check-domain-purity.mjs

      - run: pnpm run typecheck
      - run: pnpm run lint

      # Las pruebas de integración del ledger corren contra PostgreSQL REAL con Testcontainers.
      # `KOINONIA_REQUIRE_DOCKER=1` hace que la ausencia de Docker sea un FALLO y no un salto
      # silencioso: un build verde que no probó nada del ledger es peor que un build rojo.
      - name: Comprobar que Docker está disponible
        run: docker info

      - run: pnpm run test
        env:
          KOINONIA_REQUIRE_DOCKER: '1'

      - run: pnpm run build
