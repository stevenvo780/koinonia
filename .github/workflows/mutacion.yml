name: Mutación

# `docs/TESTING.md` §10: la cobertura dice qué líneas se ejecutaron; la mutación dice si las
# aserciones sirven de algo. Estuvo definida y sin ejecutar desde que se escribió el documento, que
# es la peor de las dos opciones: el umbral daba la impresión de estar vigilado y no vigilaba nada.
#
# ⚠ ESTE TRABAJO SIGUE FALLANDO, y falla a propósito. Bajar el umbral para poner esto en verde sería
# tapar exactamente el hallazgo que la herramienta existe para producir; el informe subido como
# artefacto lleva la lista de mutantes que sobreviven, que es el trabajo pendiente.
#
# Medido sobre 4050 mutantes (2026-08-22), contra el umbral de 85 %:
#
#   ámbito   | antes   | ahora   | qué pasó
#   ---------|---------|---------|------------------------------------------------------------------
#   GLOBAL   | 62,10 % | 73,68 % |
#   reglas   | 76,30 % | 89,50 % | **pasa el umbral**; `ballot.ts` 58,42 → 96,56
#   tally    | 48,95 % | 65,61 % | cinco de diez escrutadores por encima del 94 %
#   crypto   | 77,34 % | 77,34 % | sin tocar
#
# Dentro de `tally`, lo que ya está hecho y lo que falta:
#
#   supermajority.ts 19,23 → 97,44   ·   condorcet-schulze.ts 43,92  (sin tocar)
#   simple-majority.ts 56,16 → 97,26 ·   score.ts             43,15  (sin tocar)
#   unanimity.ts     43,40 → 94,34   ·   irv.ts               46,58  (sin tocar)
#   common.ts        65,59 → 94,41   ·   majority-judgment.ts 49,81  (sin tocar)
#   consent.ts       47,01 → 95,73   ·   sortition.ts         54,71  (sin tocar)
#
# El patrón de los cinco arreglados fue siempre el mismo y sirve de guion para los cinco que quedan:
# los tests afirmaban sobre `outcome` y nadie miraba `steps`, `tables` ni `narrative`, que es
# justamente lo que entra en la preimagen del `resultHash` y lo único que una asamblea lee.
#
# En los cinco ya trabajados, lo que sobrevive está **demostrado equivalente o inalcanzable** (guarda
# defensiva que `normalize` ya cubre, `options[0]` que A.8.1 impide que sea `undefined`, y la rama
# `cast` de `unanimity.ts:84`, que ningún denominador de B.4 puede alcanzar). No son deuda de prueba.
#
# NO se engancha a los pull requests todavía, aunque §10 lo pida («en todo PR que lo toque»). Con la
# puntuación por debajo del umbral, un guardián en el PR bloquearía cualquier cambio en
# `packages/domain` sin relación con el motivo del rojo. Se engancha el día que la puntuación pase
# de 85 %, y ese día el guardián sí protege algo en vez de estorbar.
#
# `KOINONIA_MUTAR=reglas` **ya está por encima de 85 %**: es el primer ámbito que se puede enganchar
# a los PR sin que estorbe, en cuanto se quiera separar el trabajo por ámbitos.

on:
  schedule:
    # 06:30 UTC = 01:30 en Bogotá. Cada noche.
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      ambito:
        description: 'Ámbito a mutar: vacío (todo), crypto, tally o reglas'
        required: false
        default: ''

concurrency:
  group: mutacion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutacion:
    name: Stryker · ${{ inputs.ambito || 'crypto + tally + reglas' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Stryker sólo lanza las pruebas unitarias de `packages/crypto` y `packages/domain`
      # (`stryker.config.vitest.mjs`). No hace falta Docker: `tests/integration/**` queda fuera a
      # propósito, porque relanzar testcontainers una vez por mutante son días, no minutos.
      - run: pnpm run mutation
        env:
          KOINONIA_MUTAR: ${{ inputs.ambito }}

      # `!cancelled()`: el informe es lo que hay que mirar JUSTO cuando el paso anterior falla.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: informe-mutacion
          path: reports/mutation/
          retention-days: 30
